<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830">
<defs>
  <style>
    .bg{fill:#0b1220}.panel{fill:#111d31;stroke:#4b6687;stroke-width:2;rx:18}
    .title{font:700 27px sans-serif;fill:#e8f0fb}.sub{font:17px sans-serif;fill:#c5d4e8}
    .label{font:700 19px sans-serif;fill:#e8f0fb}.small{font:15px sans-serif;fill:#b7c8dc}
    .arrow{stroke:#7db4ff;stroke-width:3;fill:none;marker-end:url(#arr)}
    .arrow2{stroke:#7dd3c7;stroke-width:3;fill:none;marker-end:url(#arr2)}
  </style>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7db4ff"/></marker>
  <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7dd3c7"/></marker>
</defs>
<rect class="bg" width="1200" height="830"/>
<text x="600" y="48" text-anchor="middle" class="title">ROS 2 Autonomous Mobile Manipulator — Source Architecture</text>
<text x="600" y="78" text-anchor="middle" class="small">Sherpa / Edubot mobile base integrated with DOBOT ME6 arm</text>
