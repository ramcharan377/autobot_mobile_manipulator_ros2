controller_manager:
  ros__parameters:

    update_rate: 100
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    me6_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


# ============================================================
# EDUBOT BASE
# ============================================================

diff_cont:
  ros__parameters:

    left_wheel_names:
      - left_wheel_joint

    right_wheel_names:
      - right_wheel_joint

    wheel_separation: 0.35
    wheel_radius: 0.1032

    base_frame_id: base_link
    odom_frame_id: odom

    publish_rate: 50.0

    use_stamped_vel: true


# ============================================================
# ME6 ARM
# ============================================================

me6_group_controller:
  ros__parameters:

    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity
